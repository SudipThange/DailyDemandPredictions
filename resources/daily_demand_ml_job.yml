resources:
  jobs:
    new_daily_demand_ml_job:
      name: new_daily_demand_ml_job_dab

      schedule:
        quartz_cron_expression: "0 0 0 * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: "UNPAUSED"

      tags:
        project: daily_demand_prediction
        environment: ${bundle.target}
        team: data_science
        managed_by: databricks_dab
        pipeline: ml_pipeline

      email_notifications:
        on_success:
          - sudipthange856@gmail.com
        on_failure:
          - sudipthange856@gmail.com

      tasks:
        - task_key: data_preparation
          spark_python_task:
            python_file: /Workspace/Users/sudipthange856@gmail.com/supply_chain_project/src/data_preparation/main_data_preparation.py
          environment_key: Default

        - task_key: model_training
          depends_on:
            - task_key: data_preparation
          spark_python_task:
            python_file: /Workspace/Users/sudipthange856@gmail.com/supply_chain_project/src/model_training/main_model_training.py
          environment_key: Default

        - task_key: model_predictions
          depends_on:
            - task_key: model_training
          spark_python_task:
            python_file: /Workspace/Users/sudipthange856@gmail.com/supply_chain_project/src/model_predictions/main_model_predictions.py
          environment_key: Default

      queue:
        enabled: true

      environments:
        - environment_key: Default
          spec:
            dependencies:
              - -r
                /Workspace/Users/sudipthange856@gmail.com/supply_chain_project/requirements.txt
            environment_version: "6"

      performance_target: PERFORMANCE_OPTIMIZED